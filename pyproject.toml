[project]
name = "rice-switcher"
version = "0.1.0"
description = "Switch between Hyprland rice configurations with managed process components."
requires-python = ">=3.11"
license = { text = "MIT" }
readme = "README.md"
# Zero runtime dependencies: stdlib only. See PLAN.md §5.1.
dependencies = []

[project.scripts]
rice-switcher = "rice_switcher.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["rice_switcher"]
